# The Rust CLI's CI. Lives beside ci.yml rather than inside it because
# ci.yml is byte-identical across the ten *-le repos (letools-site's
# fleet check); this file is invisible to that check.
#
# Paths include the extension's extraction sources on purpose: parity
# must fail when EITHER side drifts from the shared corpus, and an edit
# to src/extraction/heuristics.ts would otherwise land green.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a
  # commit with no way to be verified. Dispatch is the escape hatch.
  # ci.yml cannot have this: it is byte-identical across the ten *-le
  # repos and the fleet check enforces that.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'
  pull_request:
    paths:
      - 'crate/**'
      - 'src/extraction/**'
      - 'src/mcp/**'
      - 'scripts/check-extraction-parity.ts'
      - '.github/workflows/ci-crate.yml'
      # The policy job greps every *.md, and in the crate-only repos holds
      # the six agent instruction files to one document. A change to one of
      # those has to be able to reach it — the filter used to admit only
      # crate/**, so both gates could fire only when the files they guard
      # had not been touched. The Rust jobs below skip themselves instead.
      - '**/*.md'
      - '.cursorrules'
      - '.windsurfrules'
      - '.clinerules'
      - '.cursor/**'
      - '.github/copilot-instructions.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  # Whether anything the Rust jobs depend on actually moved. "Docs" is
  # deliberately narrow — *.md, LICENSE and the agent instruction files —
  # and anything unrecognised, or an unreadable diff, counts as code. The
  # default is always to run more, never less.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-list --max-parents=0 HEAD | tail -1)"
            fi
            range="$before..HEAD"
          fi

          if ! files="$(git diff --name-only "$range")"; then files=""; fi

          code=false
          if [ -z "$files" ]; then code=true; fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | LICENSE | .cursorrules | .windsurfrules | .clinerules) ;;
              .cursor/* | .github/copilot-instructions.md) ;;
              *) code=true; break ;;
            esac
          done <<EOF
          $files
          EOF

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code, files changed:"
          echo "$files"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # extract/ is the layer the corpus pins and the layer that must
      # stay pure. A filesystem call in it means the "testable from a
      # fixture file, no flake" claim in AGENTS.md has quietly stopped
      # being true.
      - name: Forbid filesystem access in the pure extraction layer
        working-directory: .
        run: |
          # Comment lines are filtered out: the module doc in
          # extract/mod.rs names `std::fs` to say it must not appear.
          if grep -rn 'std::fs\|File::open' crate/src/extract --include='*.rs' \
             | grep -v ':[0-9]*: *//'; then
            echo 'extract/ must not touch the filesystem — that belongs in walk.rs and scan.rs.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for extract/.
  # Enforced per module, not on the total: a total hides one module
  # sliding while the others carry it. Scoped to extract/ because
  # everything else is I/O verified by the contract and scenario jobs.
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is
        # exactly when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on extract/
        run: |
          python3 - <<'PY'
          import json, sys
          # A backstop against a module nobody tested, not a target. It sits
          # well below where the code actually is — the lowest measured module
          # in the family was 92.69% against the old 90.0 floor, i.e. 2.69
          # points from failing a build over a single new branch. A floor that
          # tracks actual coverage stops being a floor and becomes a tax on
          # writing the next module. Do not raise this to chase a number.
          FLOOR = 75.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/extract/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              if name == "corpus.rs":
                  continue  # the corpus runner is test-only scaffolding
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:16} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in extract/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  # What only a document too big for the fast path can prove: the
  # 50,000-URL cap, and that the scanner stays linear while reaching it.
  scenarios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Scenarios against an oversized document
        env:
          STRING_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # Fails when the extension's extraction behaviour and the shared
  # corpus (crate/fixtures/) disagree — the reason both frontends live
  # in one repo at all.
  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Extraction and MCP parity
        working-directory: .
        run: bun scripts/check-extraction-parity.ts

  # Files and trees that break tools: a BOM, a NUL, invalid UTF-8, a
  # FIFO, a symlink loop, a path over 260 characters. Every case asserts
  # the process does not panic, does not hang, and exits 0, 1 or 2 —
  # never on a signal. Three platforms, because that is where they
  # differ; the tree is built at runtime because Windows cannot check
  # half of it in.
  hazards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous files and trees, against the built binary
        run: cargo test --locked --test hazards -- --test-threads=1 --nocapture

  # Behaviour that differs by operating system, asserted rather than
  # hoped: report paths, timezone independence, case-folding
  # filesystems, names Windows reserves, and a child that refuses
  # before its stdin is written.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Platform behaviour
        run: cargo test --locked --test platform -- --test-threads=1 --nocapture
      # The suite must not depend on TZ, because Windows ignores it. Run
      # it twice — once pinned to UTC, once with the variable gone — and
      # require both to pass. A suite that reads a clock fails one.
      - name: The whole suite, pinned to UTC
        env:
          TZ: UTC
        run: cargo test --locked
      - name: The whole suite again, with no TZ at all
        run: cargo test --locked

  # The corpus pins the cases somebody thought of; this generates the
  # ones nobody did. Scope is the SHARED extract_strings tool: one tool
  # name, one schema, two servers, and an agent must get the same answer
  # whichever it reaches. The two *surfaces* are allowed to differ — the
  # walk, --strict, --values and exit codes are the crate's alone — so
  # they are not compared here.
  differential:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - run: cargo build --locked
      # A fixed seed so a failure is reproducible, and the run number so
      # the search moves between builds. Both are printed on every run.
      - name: Both servers, on generated documents
        working-directory: .
        env:
          DIFFERENTIAL_SEED: ${{ github.run_number }}
          DIFFERENTIAL_CASES: '600'
        run: bun scripts/check-differential.ts

  # A standing net over the pure layer, not a proof. Sixty seconds per
  # target against a seed that moves, with the seed and the document
  # printed on any failure. Any panic, any hang, any run that never
  # terminates is a failure.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Fuzz the extraction layer
        env:
          STRING_LE_FUZZ_SECONDS: '60'
          STRING_LE_FUZZ_SEED: ${{ github.run_number }}
        run: cargo test --release --locked --bin string-le extract::fuzz -- --test-threads=1 --nocapture

  # A wall clock on a fixed tree. secrets-le was fifty times slower than
  # its siblings for a release because nothing measured it. Release
  # build: the ceiling in budget.rs was measured against one.
  budget:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Wall-clock budget and linearity
        env:
          STRING_LE_BUDGET: '1'
        run: cargo test --release --locked --test budget -- --test-threads=1 --nocapture

  # Does this crate open what it claims to open? One file per name in
  # the alias table plus a dozen extensions it has never heard of, and a
  # report line required for every one. Also fails when a format can be
  # named and no corpus document exercises it.
  coverage-matrix:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every claimed format is opened and read
        run: cargo test --locked --test coverage_matrix -- --nocapture
